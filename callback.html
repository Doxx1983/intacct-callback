<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Intacct Callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 6rem; font-family: monospace; }
  button { margin-top: .5rem; padding: .5rem 1rem; }
</style>
</head>
<body>
<h1>Anmeldung abgeschlossen</h1>
<p id="msg">Lese Antwort ...</p>
<textarea id="code" readonly hidden></textarea>
<button id="copy" hidden>Code kopieren</button>
<p><small>Diese Seite sendet nichts an einen Server. Der Code wird nur hier angezeigt.</small></p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code');
  var err = p.get('error');
  var msg = document.getElementById('msg');
  var box = document.getElementById('code');
  var btn = document.getElementById('copy');
  if (code) {
    msg.textContent = 'Kopiere diesen Code in das Terminal, in dem der Login läuft:';
    box.value = code;
    box.hidden = false;
    btn.hidden = false;
    btn.onclick = function () {
      box.select();
      navigator.clipboard.writeText(code).then(function () { btn.textContent = 'Kopiert'; });
    };
    history.replaceState(null, '', location.pathname);
  } else if (err) {
    msg.textContent = 'Fehler von Sage: ' + err + (p.get('error_description') ? ' - ' + p.get('error_description') : '');
  } else {
    msg.textContent = 'Kein Code in der URL gefunden.';
  }
</script>
</body>
</html>
